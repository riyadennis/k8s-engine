apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-rest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-rest-service
  template:
    metadata:
      labels:
        app: ingestion-rest-service
    spec:
      containers:
        - name: ingestion-rest-service
          image: riyadennis/ingestion-rest-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: REST_PORT
              value: "8090"
            - name: STORAGE_ENDPOINT
              value: "127.0.0.1:9000"
            - name: STORAGE_USE_SSL
              value: "false"
            - name: STORAGE_ACCESS_KEY
              value: "admin"
            - name: STORAGE_SECRET_KEY
              value: "password123"
            - name: STORAGE_BUCKET_NAME
              value: "test"
            # This should point at the identity service inside the cluster.
            # Make sure there is a Service named `identity-server` listening on this port.
            - name: IDENTITY_URL
              value: "identity-server:8090"
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "admin"
            - name: MINIO_ROOT_PASSWORD
              value: "password123"
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-rest-service
spec:
  selector:
    app: ingestion-rest-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090