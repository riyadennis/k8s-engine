apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-rest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-rest-service
  template:
    metadata:
      labels:
        app: ingestion-rest-service
    spec:
      containers:
        - name: ingestion-rest-service
          image: riyadennis/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: REST_PORT
              value: "8090"
            - name: STORAGE_ENDPOINT
              value: "minio:9000"
            - name: STORAGE_USE_SSL
              value: "false"
            - name: STORAGE_ACCESS_KEY
              value: "admin"
            - name: STORAGE_SECRET_KEY
              value: "password123"
            - name: STORAGE_BUCKET_NAME
              value: "test"
            # This should point at the identity service inside the cluster.
            # Make sure there is a Service named `identity-server` listening on this port.
            - name: IDENTITY_URL
              value: "identity-server:8090"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-rest-service
spec:
  selector:
    app: ingestion-rest-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090